[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "greth-offensive"
version = "0.1.0"
description = "Human Command, Greater Offense."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.27",
    "langchain>=1.4.6",
    "langgraph>=1.2.15",
    "litellm>=1.106.0",
    "mcp>=2.3.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
greth = "greth.main:run"


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]


[tool.uv]
package = true
default-groups = ["dev"]


[tool.hatch.build.targets.wheel]
packages = ["greth"]


[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "PT",
    "ASYNC",
    "RUF",
    "PGH",
]

[tool.ruff.lint.isort]
known-first-party = ["greth"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.coverage.run]
source = ["greth"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
